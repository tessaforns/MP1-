[project]
name = "mp1-bicibcn"
version = "0.1.0"
description = "Miniproyecto 1: cuadro de mando de BiciBCN (desarrollo guiado por especificación)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "polars>=1.0",
    "duckdb>=1.1",
    "plotly>=5.24",
    "streamlit>=1.40",
    "nbformat>=5.11.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["criterio(id): criterio de aceptación que verifica el test (p. ej. CA3 o CD1)"]
