# En cada push: descarga los datos, ejecuta el pipeline, los tests y la trazabilidad.
name: tests
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Descargar datos
        run: uv run python scripts/descargar_datos.py
      - name: Pipeline
        run: uv run python -m src.pipeline
      - name: Tests
        run: uv run pytest -q
      - name: Trazabilidad
        run: uv run python scripts/trazabilidad.py
